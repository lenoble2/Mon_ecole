

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Relevés de Notes - Pleine Page</title>
    <!-- Inclusion de QRCode.js pour générer dynamiquement les QR codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @page { size: A4; margin: 8mm; }
        body { margin: 0; padding: 0; background: #eee; font-family: 'Times New Roman', Times, serif; }
        .page-a4 {
            width: 210mm;
            height: 297mm;
            padding: 10mm 15mm;
            margin: 10px auto;
            background-color: white;
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
            position: relative;
        }
        .header-top {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            line-height: 1.3;
            text-transform: uppercase;
            border-bottom: 2px solid #000;
            padding-bottom: 6px;
            margin-bottom: 10px;
        }
        .exam-title-box {
            border: 2.5px solid #000;
            text-align: center;
            padding: 6px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .exam-title-box h3 { margin: 0; font-size: 13px; text-transform: uppercase; }
        .exam-title-box h4 { margin: 3px 0 0 0; font-size: 14px; text-transform: uppercase; }
        .candidate-info {
            font-size: 12.5px;
            margin-bottom: 14px;
            line-height: 1.6;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .info-left { width: 65%; }
        .info-right { width: 35%; text-align: right; }
        .candidate-info input { border: none; background: transparent; font-family: inherit; font-size: 12.5px; }
        .candidate-info input.with-line { border-bottom: 1px solid #aaa; }
        .notes-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .notes-table th, .notes-table td {
            border: 2px solid #000;
            padding: 7px 10px;
            text-align: center;
            vertical-align: middle;
        }
        .notes-table th {
            background-color: #f2f2f2;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
        }
        .text-left { text-align: left !important; padding-left: 12px !important; }
        .notes-table input { width: 95%; border: none; text-align: center; font-family: inherit; font-size: 12px; background: transparent; }
        .tgp-box {
            border: 2.5px solid #000;
            padding: 5px 12px;
            font-weight: bold;
            display: inline-block;
            font-size: 13px;
            background: #fff;
            margin-top: 3px;
        }
        .footer-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .signature-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 8px;
        }
        .qr-placeholder {
            width: 75px;
            height: 75px;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            overflow: hidden;
        }
        .signature-box {
            text-align: right;
            width: 48%;
            font-size: 12px;
        }
        .signature-box .title-sig {
            font-weight: bold;
            margin-bottom: 30px;
        }
        .legal-notes {
            font-size: 8.5px;
            margin-top: 10px;
            line-height: 1.35;
            border-top: 1.5px dashed #666;
            padding-top: 6px;
        }
        .legal-notes ul {
            margin: 0;
            padding-left: 15px;
        }
        @media print {
            body { background: none; }
            .page-a4 { margin: 0; border: none; box-shadow: none; height: 297mm; }
            .no-print { display: none !important; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="no-print" style="background:#333; color:white; padding:12px 25px; display:flex; justify-content:space-between; align-items:center; border-radius:5px; margin-bottom:15px; width:210mm; margin-left:auto; margin-right:auto; box-sizing:border-box;">
    <div style="display: flex; gap: 15px; align-items: center;">
        <label for="periode-select"><b>Période / Composition :</b></label>
        <select id="periode-select" onchange="chargerDonnees()" style="padding:6px; border-radius:4px; font-size:1em;">
            <option value="COMPO1">COMPO 1</option>
            <option value="COMPO2">COMPO 2</option>
            <option value="COMPO3">COMPO 3</option>
            <option value="PASSAGE">COMPO DE PASSAGE</option>
            <option value="FIN_ANNEE" selected>RÉSULTATS FIN D'ANNÉE</option>
        </select>
    </div>
    <div>
        <button onclick="window.print()" style="padding: 10px 20px; background: #00a859; color: white; border: none; cursor: pointer; font-size: 14px; font-weight:bold; border-radius:4px;">🖨️ Imprimer les Relevés</button>
        <a href="accueil.html" style="background:#6c757d; color:white; padding:10px 15px; text-decoration:none; border-radius:4px; font-weight:bold; margin-left:10px;">Retour Gestion</a>
    </div>
</div>

<div id="conteneur-pages"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const annee = urlParams.get('annee') || '2025';
    const niveauFiltreURL = (urlParams.get('niveau') || urlParams.get('classe') || '').trim();
    let periodeActuelle = 'FIN_ANNEE';
    let configProfData = {};

    function calculerReleve(pageDiv) {
        const exp = parseFloat(pageDiv.querySelector('.exp_texte').value) || 0;
        const aem = parseFloat(pageDiv.querySelector('.aem').value) || 0;
        const orth = parseFloat(pageDiv.querySelector('.orthographe').value) || 0;
        const math = parseFloat(pageDiv.querySelector('.mathematiques').value) || 0;

        const totalT1 = exp + aem + orth + math;
        pageDiv.querySelector('.total_t1').innerText = totalT1;

        const mgaInput = pageDiv.querySelector('.mga');
        let mgaVal = parseFloat(mgaInput.value);
        let mga = isNaN(mgaVal) ? 10 : mgaVal;
        
        mgaInput.value = mga.toFixed(2);

        const totalT2 = (mga * 8.5).toFixed(2);
        pageDiv.querySelector('.total_t2').innerText = totalT2;
        const tgp = ((6 * totalT1 + 4 * parseFloat(totalT2)) / 10).toFixed(2);
        pageDiv.querySelector('.tgp_val').innerText = tgp;

        const decisionElem = pageDiv.querySelector('.decision');
        if (parseFloat(tgp) < 85) {
            decisionElem.innerText = "REFUS";
            decisionElem.style.color = "#d9534f";
        } else {
            decisionElem.innerText = "ADMIS";
            decisionElem.style.color = "green";
        }
    }

    async function chargerDonnees() {
        periodeActuelle = document.getElementById('periode-select').value;
        try {
            try {
                const resConfig = await fetch('/api/config-prof');
                if (resConfig.ok) {
                    configProfData = await resConfig.json();
                }
            } catch (err) {
                console.log("Configuration prof inaccessible.");
            }

            let listeDistante = [];
            try {
                const response = await fetch(`/api/eleves/${annee}?periode=${periodeActuelle}`);
                if (response.ok) {
                    listeDistante = await response.json();
                }
            } catch (err) {
                console.log("Serveur distant inaccessible.");
            }

            if (!Array.isArray(listeDistante)) {
                listeDistante = listeDistante.eleves || listeDistante.data || [];
            }

            let localData = localStorage.getItem('hva_eleves') || localStorage.getItem('hva_factures');
            let listeLocale = localData ? JSON.parse(localData) : [];

            let listeClients = [...listeDistante];
            listeLocale.forEach(clientLocal => {
                const existe = listeClients.some(c => (c.id == clientLocal.id || c._id == clientLocal.id || c.matricule == clientLocal.matricule));
                if (!existe) {
                    listeClients.push(clientLocal);
                }
            });

            let listeElevesFiltres = [];
            if (niveauFiltreURL) {
                listeElevesFiltres = listeClients.filter(c => {
                    const nivEleve = (c.niveau || c.classe || '').trim().toUpperCase();
                    return nivEleve === niveauFiltreURL.toUpperCase();
                });
            } else {
                listeElevesFiltres = listeClients.filter(c => {
                    const nivEleve = (c.niveau || c.classe || '').trim().toUpperCase();
                    return nivEleve === 'CM2';
                });
            }

            if (listeElevesFiltres.length === 0) {
                document.getElementById('conteneur-pages').innerHTML = `<div style="text-align:center; padding:50px; font-family:sans-serif;"><h3>Aucun élève trouvé pour le niveau : ${niveauFiltreURL || 'Non spécifié'}</h3></div>`;
                return;
            }

            const conteneur = document.getElementById('conteneur-pages');
            conteneur.innerHTML = "";

            listeElevesFiltres.forEach((data, index) => {
                const notes = data.notes || {};
                const exp = notes.exp_texte ?? notes.exp_ecrite ?? data.exp_texte ?? data.exp_ecrite ?? 23;
                const aem = notes.aem ?? data.aem ?? 30;
                const orth = notes.dictee ?? notes.orthographe ?? data.dictee ?? data.orthographe ?? 16;
                const math = notes.math ?? notes.mathematiques ?? data.math ?? data.mathematiques ?? 18;
                
                let mgaBrute = data.moyenne ?? data.moyen ?? data.mg ?? data.Moyenne ?? data.Moyen ?? 10;
                const mga = parseFloat(mgaBrute).toFixed(2);

                const lieuNaissance = data.lieu_etab || data.lieu_naissance || data.localite || 'SEITIFLA';
                const ecoleOrigine = data.ecole_origine || data.ecole || configProfData.ecole || 'EPP SEITIFLA';
                const centreExamen = ecoleOrigine;
                const ieppVal = data.iepp || data.iep || configProfData.iepp || '';
                const drenVal = data.dren || data.drena || configProfData.drena || '';
                const nomDirecteur = configProfData.nom_directeur || "N'GUESSAN KOUAME";

                const nomPrenoms = `${(data.nom || '').toUpperCase()} ${(data.prenoms || '').toUpperCase()}`.trim();
                const matriculeEleve = data.matricule || '';
                const qrUniqueId = `qr-code-${index}`;

                const page = document.createElement('div');
                page.className = 'page-a4';
                page.innerHTML = `
                    <div>
                        <div class="header-top">
                            DIRECTION DES EXAMEN ET CONCOURS<br>
                            Tél : 20 32 83 04/ 20 32 00 74/ fax : 20 32 66 49 | Site : www.men-deco.org - Email : Deco2006@gmail.com
                        </div>

                        <div class="exam-title-box">
                            <h3>EXAMEN DU CEPE - SESSION ${annee}</h3>
                            <h4>RELEVE DE NOTES CANDIDAT OFFICIEL</h4>
                        </div>

                        <div class="candidate-info">
                            <div class="info-row">
                                <div class="info-left"><b>M/Mr</b> &nbsp; <b><input type="text" class="with-line" value="${nomPrenoms}" style="width:70%;"></b></div>
                                <div class="info-right"><b>N° de Table :</b> 000${2811 + index}836</div>
                            </div>
                            <div class="info-row" style="margin-top: 4px;">
                                <div class="info-left">Né(e) le <input type="text" class="with-line" value="${data.date_naissance || ''}" style="width:100px;"> à <input type="text" class="with-line" value="${lieuNaissance}" style="width:130px;"></div>
                                <div class="info-right"><b>Matricule :</b> <input type="text" class="with-line" value="${matriculeEleve}" style="width:110px;"></div>
                            </div>
                            <div style="margin-top: 4px;"><b>Ecole d'origine :</b> <input type="text" class="with-line" value="${ecoleOrigine}" style="width:80%;"></div>
                            <div class="info-row" style="margin-top: 4px;">
                                <div><b>Centre d'Examen :</b> <input type="text" class="with-line" value="${centreExamen}" style="width:160px;"></div>
                                <div><b>Code IEPP :</b> <input type="text" value="" style="width:90px;"></div>
                            </div>
                            <div style="margin-top: 4px;"><b>IEPP :</b> <input type="text" class="with-line" value="${ieppVal}" style="width:190px;"> &nbsp;&nbsp; <b>DREN/DDEN :</b> <input type="text" class="with-line" value="${drenVal}" style="width:130px;"></div>
                        </div>

                        <div style="font-size: 12.5px; margin-bottom: 6px;">a obtenu les notes et moyennes suivantes :</div>

                        <table class="notes-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">TYPE D'EVALUATION</th>
                                    <th style="width: 35%;">EPREUVES</th>
                                    <th style="width: 18%;">POINTS ET MOYENNE OBTENUS</th>
                                    <th style="width: 10%;">NOTES SUR</th>
                                    <th style="width: 12%;">EXAMEN DU CEPE</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td rowspan="5" style="font-weight: bold;">EVALUATION FINALE<br>60%</td>
                                    <td class="text-left">EXPLOITATION DE TEXTE</td>
                                    <td><input type="number" class="exp_texte" value="${exp}" oninput="calculerReleve(this.closest('.page-a4'))"></td>
                                    <td>50</td>
                                    <td rowspan="5" style="background:#fff; text-align:center;">
                                        <div style="font-size: 11px; font-weight:bold;">TGP</div>
                                        <div class="tgp-box tgp_val">0.00</div>
                                        <div style="margin-top: 10px; font-size: 11px; font-weight: bold;">DECISION DU JURY</div>
                                        <div class="decision" style="margin-top: 5px; font-size: 13px; font-weight:bold;">-</div>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="text-left">EVEIL AU MILIEU</td>
                                    <td><input type="number" class="aem" value="${aem}" oninput="calculerReleve(this.closest('.page-a4'))"></td>
                                    <td>50</td>
                                </tr>
                                <tr>
                                    <td class="text-left">ORTHOGRAPHE</td>
                                    <td><input type="number" class="orthographe" value="${orth}" oninput="calculerReleve(this.closest('.page-a4'))"></td>
                                    <td>20</td>
                                </tr>
                                <tr>
                                    <td class="text-left">MATHEMATIQUES</td>
                                    <td><input type="number" class="mathematiques" value="${math}" oninput="calculerReleve(this.closest('.page-a4'))"></td>
                                    <td>50</td>
                                </tr>
                                <tr style="font-weight: bold; background: #fafafa;">
                                    <td class="text-left">TOTAL (T1)</td>
                                    <td class="total_t1">0</td>
                                    <td>170</td>
                                </tr>
                                <tr>
                                    <td rowspan="2" style="font-weight: bold;">CONTRÔLE CONTINU<br>40%</td>
                                    <td class="text-left">MOYENNE GENERALE ANNUELLE (M.G.A)</td>
                                    <td><input type="number" step="0.01" class="mga" value="${mga}" oninput="calculerReleve(this.closest('.page-a4'))"></td>
                                    <td>20</td>
                                    <td rowspan="2" style="background: #fafafa;"></td>
                                </tr>
                                <tr style="font-weight: bold; background: #fafafa;">
                                    <td class="text-left">TOTAL DES POINTS OBTENUS AU CONTRÔLE CONTINU (T2)</td>
                                    <td class="total_t2">0</td>
                                    <td>170</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="footer-meta">
                            <div><b>T2 = 8.5 x MGA</b></div>
                            <div>Fait à ........................, le 29/07/2026</div>
                        </div>

                        <div style="font-size: 11px; margin-bottom: 6px;">Total Général Pondéré (TGP) : TGP= (6xT1 + 4xT2) /10</div>

                        <div class="signature-section">
                            <div class="qr-placeholder" id="${qrUniqueId}"></div>
                            <div class="signature-box">
                                <div class="title-sig">Le Président du JURY (Nom, Signature et Cachet)</div>
                                <div><b>${nomDirecteur}</b></div>
                            </div>
                        </div>
                    </div>

                    <div class="legal-notes">
                        <b>N.B. :</b>
                        <ul>
                            <li>Ce relevé de notes n'est pas le diplôme du CEPE et il ne peut en faire office.</li>
                            <li>Le diplôme sera délivré, sur présentation du présent document, par l'Inspecteur de l'Enseignement Préscolaire et Primaire de la circonscription dans laquelle le candidat a composé.</li>
                            <li>Pour tout besoin de constitution de dossier administratif, adresser une demande d'attestation à usage administratif à la Direction des Examens et Concours: www.men-deco.org</li>
                            <li>Toute surcharge annule le présent relevé.</li>
                            <li>La photocopie n'est pas valable.</li>
                        </ul>
                    </div>
                `;
                conteneur.appendChild(page);
                
                // Forcer le calcul des totaux et du TGP immédiatement
                calculerReleve(page);

                // Génération et affichage explicite et robuste du QR code
                setTimeout(() => {
                    const qrContainer = document.getElementById(qrUniqueId);
                    if (qrContainer) {
                        qrContainer.innerHTML = ""; // Vider d'éventuels résidus
                        new QRCode(qrContainer, {
                            text: `Nom & Prénoms: ${nomPrenoms} | Matricule: ${matriculeEleve}`,
                            width: 75,
                            height: 75,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    }
                }, 150);
            });
        } catch (err) {
            console.error("Erreur de chargement:", err);
        }
    }

    window.onload = function() {
        chargerDonnees();
    };
</script>
</body>
</html>

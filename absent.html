<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Registre d'Appel - Gestion des Absences</title>
    <!-- Inclusion de SheetJS (xlsx) pour l'export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 15px; background-color: #f4f6f9; color: #333; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        h3 { color: #1e293b; margin-top: 0; margin-bottom: 15px; font-size: 1.1em; }
        .filter-container { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 8px 16px; cursor: pointer; border: 1px solid #cbd5e1; background-color: #ffffff; border-radius: 4px; font-weight: 600; color: #475569; transition: all 0.2s; }
        .filter-btn:hover { background-color: #f1f5f9; }
        .filter-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .select-annee { padding: 8px 12px; border: 1px solid #cbd5e1; background-color: #ffffff; border-radius: 4px; font-weight: 600; color: #1e293b; cursor: pointer; }
        #conteneurTableau { overflow: auto; background: white; padding: 0; border-radius: 6px; border: 1px solid #cbd5e1; max-height: 650px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        table { border-collapse: collapse; width: max-content; font-size: 0.82em; }
        th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: center; white-space: nowrap; }
        /* En-têtes fixes multi-niveaux */
        th { background-color: #f8fafc; color: #1e293b; font-weight: 700; position: sticky; z-index: 10; }
        /* Ligne 1 des th */
        thead tr:nth-child(1) th { top: 0; background-color: #f1f5f9; }
        /* Ligne 2 des th */
        thead tr:nth-child(2) th { top: 29px; background-color: #e2e8f0; }
        /* Ligne 3 des th */
        thead tr:nth-child(3) th { top: 58px; background-color: #f8fafc; }
        /* Ligne 4 des th */
        thead tr:nth-child(4) th { top: 87px; background-color: #f8fafc; }
        /* Colonnes fixes à gauche (Matricule et Nom) avec largeurs et décalages précis pour éviter le chevauchement */
        th.sticky-col-0, td.sticky-col-0 { position: sticky; left: 0; z-index: 20; background-color: #ffffff; width: 35px; min-width: 35px; max-width: 35px; }
        th.sticky-col-1, td.sticky-col-1 { position: sticky; left: 35px; z-index: 20; background-color: #ffffff; font-weight: bold; text-align: left; width: 85px; min-width: 85px; max-width: 85px; }
        th.sticky-col-2, td.sticky-col-2 { position: sticky; left: 120px; z-index: 20; background-color: #ffffff; text-align: left; border-right: 2px solid #cbd5e1; width: 160px; min-width: 160px; max-width: 160px; }
        /* Ajustement z-index pour les en-têtes fixés à la fois en haut et à gauche */
        thead tr:nth-child(1) th.sticky-col-0,
        thead tr:nth-child(1) th.sticky-col-1,
        thead tr:nth-child(1) th.sticky-col-2,
        thead tr:nth-child(2) th.sticky-col-0,
        thead tr:nth-child(2) th.sticky-col-1,
        thead tr:nth-child(2) th.sticky-col-2,
        thead tr:nth-child(3) th.sticky-col-0,
        thead tr:nth-child(3) th.sticky-col-1,
        thead tr:nth-child(3) th.sticky-col-2,
        thead tr:nth-child(4) th.sticky-col-0,
        thead tr:nth-child(4) th.sticky-col-1,
        thead tr:nth-child(4) th.sticky-col-2 { z-index: 30; background-color: #e2e8f0; }
        .checkbox-cell { width: 35px; text-align: center; }
        .btn { padding: 10px 16px; color: white; text-decoration: none; border-radius: 4px; display: inline-block; cursor: pointer; border: none; font-size: 0.9em; font-weight: 600; transition: background-color: 0.2s; }
        .btn:hover { opacity: 0.9; }
        /* Couleurs pour les noms selon le sexe */
        .blue-text { color: #0000CD; font-weight: bold; }
        .red-text { color: #DC143C; font-weight: bold; }
        /* Cellule interactive personnalisée pour les absences (états 0, 1, 2) */
        .absence-cell { width: 28px; height: 28px; text-align: center; vertical-align: middle; cursor: pointer; user-select: none; position: relative; padding: 0; }
        .absence-cell .trait-h { display: none; position: absolute; top: 50%; left: 2px; right: 2px; height: 3px; background-color: #dc2626; transform: translateY(-50%); }
        .absence-cell .trait-v { display: none; position: absolute; top: 2px; bottom: 2px; left: 50%; width: 3px; background-color: #dc2626; transform: translateX(-50%); }
        .absence-cell.etat-1 .trait-h { display: block; }
        .absence-cell.etat-2 .trait-h { display: block; }
        .absence-cell.etat-2 .trait-v { display: block; }
        .actions-bar { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        /* Style pour le tableau de taux de fréquentation mensuel */
        .taux-container { margin-top: 25px; background: white; padding: 20px; border-radius: 6px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .table-taux { width: 100%; border-collapse: collapse; font-size: 0.9em; margin-top: 10px; }
        .table-taux th { background-color: #f8fafc; color: #1e293b; padding: 10px; border: 1px solid #cbd5e1; text-align: center; position: static; }
        .table-taux td { padding: 8px 10px; border: 1px solid #cbd5e1; text-align: center; }
        .input-jours { width: 60px; padding: 6px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: 600; }
        /* Configuration spécifique pour l'impression */
        @media print {
            body { background-color: #ffffff; margin: 0; padding: 0; }
            .filter-container, .actions-bar, .select-annee, .filter-btn { display: none !important; }
            #conteneurTableau { max-height: none !important; overflow: visible !important; border: none !important; box-shadow: none !important; }
            .taux-container { border: none !important; box-shadow: none !important; padding: 0 !important; margin-top: 20px !important; }
            table, .table-taux { width: 100% !important; font-size: 0.7em !important; }
            th, td { border: 1px solid #94a3b8 !important; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <h2 id="titre-registre">Registre d'Appel & Absences</h2>
    <div class="filter-container">
        <span style="font-weight: bold; margin-right: 5px; color: #475569;">Année :</span>
        <select id="select-annee-courante" class="select-annee" onchange="changerAnnee(this.value)">
            <option value="2021">2021-2022</option>
            <option value="2022">2022-2023</option>
            <option value="2023">2023-2024</option>
            <option value="2024">2024-2025</option>
            <option value="2025">2025-2026</option>
            <option value="2026" selected>2026-2027</option>
            <option value="2027">2027-2028</option>
            <option value="2028">2028-2029</option>
            <option value="2029">2029-2030</option>
        </select>
        <span style="font-weight: bold; margin-left: 15px; margin-right: 5px; color: #475569;">Mois :</span>
        <select id="select-mois-courant" class="select-annee" onchange="changerMois(this.value)">
            <option value="Tous">Tous les mois</option>
            <option value="Septembre" selected>Septembre</option>
            <option value="Octobre">Octobre</option>
            <option value="Novembre">Novembre</option>
            <option value="Décembre">Décembre</option>
            <option value="Janvier">Janvier</option>
            <option value="Février">Février</option>
            <option value="Mars">Mars</option>
            <option value="Avril">Avril</option>
            <option value="Mai">Mai</option>
        </select>
        <span id="filtre-niveau-container" style="font-weight: bold; margin-left: 15px; margin-right: 5px; color: #475569;">Niveau :</span>
        <button class="filter-btn active" onclick="filtrer('Tous', this)">Tous</button>
        <button class="filter-btn" onclick="filtrer('CP1', this)">CP1</button>
        <button class="filter-btn" onclick="filtrer('CP2', this)">CP2</button>
        <button class="filter-btn" onclick="filtrer('CE1', this)">CE1</button>
        <button class="filter-btn" onclick="filtrer('CE2', this)">CE2</button>
        <button class="filter-btn" onclick="filtrer('CM1', this)">CM1</button>
        <button class="filter-btn" onclick="filtrer('CM2', this)">CM2</button>
    </div>

    <div id="conteneurTableau">
        <table id="tableauRegistre">
            <thead id="entete-tableau"></thead>
            <tbody id="corps-tableau"></tbody>
        </table>
    </div>

    <div class="taux-container" id="section-taux-frequentation">
        <h3>📊 Tableau de Calcul du Taux de Fréquentation Mensuel</h3>
        <table class="table-taux">
            <thead>
                <tr>
                    <th>Mois</th>
                    <th>Effectif Élèves</th>
                    <th>Jours Ouvrables</th>
                    <th>Présences Potentielles</th>
                    <th>Total Absences</th>
                    <th>Total Présences</th>
                    <th>Taux de Fréquentation (%)</th>
                </tr>
            </thead>
            <tbody id="corps-tableau-taux"></tbody>
        </table>
    </div>

    <div class="actions-bar">
        <button type="button" id="btn-sauvegarder-abs" class="btn" style="background-color: #2563eb;" onclick="sauvegarderAbsences()">💾 Enregistrer les absences</button>
        <button type="button" class="btn" style="background-color: #0284c7;" onclick="imprimerRegistre()">🖨️ Imprimer Registre</button>
        <span id="conteneurBoutonRetour"></span>
    </div>

    <script>
        const urlParamsGlobal = new URLSearchParams(window.location.search);
        let roleUtilisateur = window.userRole || sessionStorage.getItem('userRole') || 'professeur';
        if (urlParamsGlobal.get('mode') === 'maitre') {
            roleUtilisateur = 'maitre';
        }

        const conteneurRetour = document.getElementById('conteneurBoutonRetour');
        if (conteneurRetour) {
            if (roleUtilisateur === 'directeur') {
                conteneurRetour.innerHTML = `<a href="accueil.html" class="btn" style="background-color: #64748b;">Retour vers Accueil</a>`;
            } else {
                conteneurRetour.innerHTML = `<button type="button" class="btn" style="background-color: #d6d8db; color: #6c757d; cursor: not-allowed;" disabled title="Accès réservé au directeur">Retour</button>`;
            }
        }

        let listeEleves = [];
        let classeFiltreeActuelle = 'Tous';
        let moisFiltreActuel = 'Septembre';
        let donneesAbsencesRecuperees = [];

        // Identification de l'élève connecté (si mode parent / élève)
        const parentIdUrl = urlParamsGlobal.get('id');
        const currentParentId = parentIdUrl || localStorage.getItem('current_parent_id') || null;

        const urlParams = new URLSearchParams(window.location.search);
        let anneeSelectionnee = urlParams.get('annee') || '2025';
        const selectAnneeElement = document.getElementById('select-annee-courante');
        if (selectAnneeElement) {
            selectAnneeElement.value = anneeSelectionnee;
        }
        const selectMoisElement = document.getElementById('select-mois-courant');
        if (selectMoisElement) {
            selectMoisElement.value = moisFiltreActuel;
        }

        const anneeSuivante = parseInt(anneeSelectionnee) + 1;
        document.getElementById('titre-registre').textContent = `Registre d'Appel & Absences ${anneeSelectionnee}-${anneeSuivante}`;

        const moisAnnee = [
            { nom: "Septembre", bg: "#e0f2fe", color: "#0369a1", border: "#bae6fd" },
            { nom: "Octobre", bg: "#fce7f3", color: "#be185d", border: "#fbcfe8" },
            { nom: "Novembre", bg: "#fef3c7", color: "#b45309", border: "#fde68a" },
            { nom: "Décembre", bg: "#d1fae5", color: "#047857", border: "#a7f3d0" },
            { nom: "Janvier", bg: "#ede9fe", color: "#6d28d9", border: "#ddd6fe" },
            { nom: "Février", bg: "#ffedd5", color: "#c2410c", border: "#fed7aa" },
            { nom: "Mars", bg: "#ccfbf1", color: "#0f766e", border: "#99f6e4" },
            { nom: "Avril", bg: "#fae8ff", color: "#a21caf", border: "#f5d0fe" },
            { nom: "Mai", bg: "#fee2e2", color: "#b91c1c", border: "#fecaca" }
        ];

        const joursCouleurs = {
            'L': { bg: '#e0e7ff', color: '#3730a3', border: '#c7d2fe' },
            'Ma': { bg: '#fae8ff', color: '#86198f', border: '#f5d0fe' },
            'Me': { bg: '#ccfbf1', color: '#115e59', border: '#99f6e4' },
            'J': { bg: '#fef3c7', color: '#92400e', border: '#fde68a' },
            'V': { bg: '#fee2e2', color: '#991b1b', border: '#fecaca' }
        };

        const joursNomsComplets = {
            'L': 'Lundi',
            'Ma': 'Mardi',
            'Me': 'Mercredi',
            'J': 'Jeudi',
            'V': 'Vendredi'
        };

        function getDatesSemaineTexte(anneeBase, moisIndex, semaineNum) {
            let year = parseInt(anneeBase);
            let realMonth = moisIndex + 8;
            let jsMonth = realMonth % 12;
            let jsYear = year + Math.floor(realMonth / 12);
            let targetDayNum = 1 + (semaineNum - 1) * 7;
            let tempDate = new Date(jsYear, jsMonth, targetDayNum);
            let dow = tempDate.getDay();
            let mondayOffset = dow === 0 ? -6 : 1 - dow;
            let monday = new Date(jsYear, jsMonth, targetDayNum + mondayOffset);
            let friday = new Date(jsYear, jsMonth, targetDayNum + mondayOffset + 4);
            let pad = (n) => String(n).padStart(2, '0');
            return `${pad(monday.getDate())} au ${pad(friday.getDate())}`;
        }

        function changerAnnee(nouvelleAnnee) {
            let currentMode = urlParamsGlobal.get('mode');
            let modeParam = currentMode ? `&mode=${currentMode}` : '';
            let idParam = currentParentId ? `&id=${currentParentId}` : '';
            window.location.href = `?annee=${nouvelleAnnee}${modeParam}${idParam}`;
        }

        function changerMois(valeur) {
            moisFiltreActuel = valeur;
            construireEntete();
            filtrer(classeFiltreeActuelle, null);
        }

        function construireEntete() {
            const thead = document.getElementById('entete-tableau');
            const moisAffiches = moisFiltreActuel === 'Tous' ? moisAnnee : moisAnnee.filter(m => m.nom === moisFiltreActuel);

            // Si un élève est connecté, on adapte l'en-tête pour afficher clairement ses absences par mois et par jour/heure
            if (currentParentId) {
                document.getElementById('titre-registre').textContent = `Mon Registre d'Absences ${anneeSelectionnee}-${anneeSuivante}`;
                let tr1 = `<tr>
                    <th class="sticky-col-1">Mois</th>
                    <th class="sticky-col-2">Semaine</th>
                    <th>Jour & Heures d'Absence</th>
                    <th>État</th>
                </tr>`;
                thead.innerHTML = tr1;
                return;
            }

            let tr1 = `<tr>
                <th rowspan="4" class="checkbox-cell sticky-col-0"><input type="checkbox" id="select-all"></th>
                <th rowspan="4" class="sticky-col-1">Matricule</th>
                <th rowspan="4" class="sticky-col-2">Nom & Prénoms</th>`;
            moisAffiches.forEach(m => {
                tr1 += `<th colspan="20" style="background-color: ${m.bg}; color: ${m.color}; border-left: 2px solid ${m.border};">${m.nom}</th>`;
            });
            tr1 += `</tr>`;

            let tr2 = `<tr>`;
            moisAffiches.forEach(m => {
                for (let s = 1; s <= 4; s++) {
                    let borderStyle = s === 1 ? `2px solid ${m.border}` : `2px solid #cbd5e1`;
                    tr2 += `<th colspan="5" style="background-color: ${m.bg}; opacity: 0.95; color: ${m.color}; border-left: ${borderStyle}; font-weight: 600;">Semaine ${s}</th>`;
                }
            });
            tr2 += `</tr>`;

            let tr3 = `<tr>`;
            moisAffiches.forEach((m) => {
                let mIdx = moisAnnee.findIndex(item => item.nom === m.nom);
                for (let s = 1; s <= 4; s++) {
                    let borderStyle = s === 1 ? `2px solid ${m.border}` : `2px solid #cbd5e1`;
                    let datesTexte = getDatesSemaineTexte(anneeSelectionnee, mIdx, s);
                    tr3 += `<th colspan="5" style="background-color: ${m.bg}; opacity: 0.9; color: ${m.color}; border-left: ${borderStyle}; font-size: 0.78em; font-weight: normal;" title="Dates de la semaine">du ${datesTexte}</th>`;
                }
            });
            tr3 += `</tr>`;

            let tr4 = `<tr>`;
            const joursNoms = ['L', 'Ma', 'Me', 'J', 'V'];
            moisAffiches.forEach((m) => {
                for (let s = 1; s <= 4; s++) {
                    joursNoms.forEach((j, jIdx) => {
                        let jColor = joursCouleurs[j];
                        let borderLeftStyle = (jIdx === 0) ? (s === 1 ? `border-left: 2px solid ${m.border};` : `border-left: 2px solid #cbd5e1;`) : 'border-left: 1px solid #e2e8f0;';
                        tr4 += `<th style="${borderLeftStyle} background-color: ${jColor.bg}; color: ${jColor.color};" title="${m.nom} - Semaine ${s} - Jour ${j}">${j}</th>`;
                    });
                }
            });
            tr4 += `</tr>`;

            thead.innerHTML = tr1 + tr2 + tr3 + tr4;
        }

        function chargerDonnees() {
            construireEntete();
            initialiserTableauTauxMensuel();

            // Si on est en mode élève connecté, on récupère d'abord les infos de l'élève connecté
            let endpointEleve = currentParentId ? `/api/get-eleve-by-parent?id=${currentParentId}` : `/api/eleves/${anneeSelectionnee}`;

            fetch(`/api/absences/${anneeSelectionnee}`)
                .then(res => res.json())
                .then(data => {
                    donneesAbsencesRecuperees = Array.isArray(data) ? data : (data.absences || []);
                })
                .catch(() => {
                    try {
                        const localData = localStorage.getItem(`absences_${anneeSelectionnee}`);
                        donneesAbsencesRecuperees = localData ? JSON.parse(localData) : [];
                    } catch (e) {
                        donneesAbsencesRecuperees = [];
                    }
                })
                .finally(() => {
                    fetch(endpointEleve)
                        .then(res => res.json())
                        .then(elevesRes => {
                            if (currentParentId) {
                                let eleveTrouve = elevesRes.eleve || elevesRes;
                                listeEleves = eleveTrouve ? [eleveTrouve] : [];
                                // Masquer les filtres de classe et les boutons d'enregistrement pour l'élève connecté
                                document.querySelector('.filter-container').style.display = 'none';
                                document.getElementById('btn-sauvegarder-abs').style.display = 'none';
                                document.getElementById('section-taux-frequentation').style.display = 'none';
                            } else {
                                listeEleves = Array.isArray(elevesRes) ? elevesRes : (elevesRes.eleves || []);
                            }
                            filtrer(classeFiltreeActuelle, null);
                        })
                        .catch(err => {
                            console.error("Erreur chargement élèves :", err);
                            const totalCols = currentParentId ? 4 : (3 + (moisFiltreActuel === 'Tous' ? 180 : 20));
                            document.getElementById('corps-tableau').innerHTML = `<tr><td colspan="${totalCols}" style="text-align:center; color:red; padding:20px;">Erreur de chargement des données de l'élève.</td></tr>`;
                        });
                });
        }

        chargerDonnees();

        function afficherTableau(data) {
            const tbody = document.getElementById('corps-tableau');
            tbody.innerHTML = '';

            if (currentParentId) {
                const totalCols = 4;
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${totalCols}" style="text-align:center; color:#666; padding:20px;">Aucune information trouvée pour cet élève.</td></tr>`;
                    return;
                }

                let eleveCourant = data[0];
                let matriculeEleve = eleveCourant.matricule || eleveCourant.id || '';
                document.getElementById('titre-registre').textContent = `Registre d'Absences de : ${eleveCourant.nom || ''} ${eleveCourant.prenoms || ''} (${matriculeEleve})`;

                // Filtrer les absences qui concernent cet élève spécifique
                let absencesEleve = donneesAbsencesRecuperees.filter(ab => String(ab.matricule) === String(matriculeEleve));

                if (absencesEleve.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${totalCols}" style="text-align:center; color:#047857; padding:25px; font-weight:bold;">🎉 Aucune absence enregistrée pour vous. Excellent parcours !</td></tr>`;
                    return;
                }

                let htmlLignes = '';
                absencesEleve.forEach(ab => {
                    let libEtat = ab.etat === 2 ? 'Absence Journée complète (2 traits)' : (ab.etat === 1 ? 'Absence Demi-journée (1 trait)' : 'Présent');
                    let badgeColor = ab.etat === 2 ? '#dc2626' : '#d97706';
                    let nomJourComplet = joursNomsComplets[ab.jour] || ab.jour;
                    let heureTexte = ab.etat === 2 ? 'Journée complète (Matin & Soir)' : 'Demi-journée';

                    htmlLignes += `<tr>
                        <td class="sticky-col-1" style="font-weight:bold; background:#f8fafc;">${ab.mois}</td>
                        <td class="sticky-col-2">Semaine ${ab.semaine}</td>
                        <td style="text-align:left; font-weight:600;">🗓️ ${nomJourComplet} — 🕒 ${heureTexte}</td>
                        <td><span style="background:${badgeColor}; color:white; padding:3px 8px; border-radius:4px; font-size:0.85em; font-weight:bold;">${libEtat}</span></td>
                    </tr>`;
                });
                tbody.innerHTML = htmlLignes;
                return;
            }

            const totalCols = 3 + (moisFiltreActuel === 'Tous' ? 180 : 20);

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${totalCols}" style="text-align:center; color:#666; padding:20px;">Aucun élève trouvé pour cette classe.</td></tr>`;
                mettreAJourTableauTaux();
                return;
            }

            const mapAbsences = {};
            donneesAbsencesRecuperees.forEach(ab => {
                const cle = `${ab.matricule}_${ab.mois}_${ab.semaine}_${ab.jour}`;
                mapAbsences[cle] = ab.etat;
            });

            const moisAffiches = moisFiltreActuel === 'Tous' ? moisAnnee : moisAnnee.filter(m => m.nom === moisFiltreActuel);

            data.forEach((e, index) => {
                let matriculeEleve = e.matricule || '';
                const sexeClean = (e.sexe || '').trim().toUpperCase();
                const estMasculin = (sexeClean === 'M' || sexeClean === 'MASCULIN' || sexeClean === 'GARÇON' || sexeClean === 'GARCON');
                const couleurClasse = estMasculin ? 'blue-text' : 'red-text';

                let tr = `<tr>
                    <td class="checkbox-cell sticky-col-0"><input type="checkbox" class="row-checkbox" data-id="${matriculeEleve || index}"></td>
                    <td class="sticky-col-1">${matriculeEleve}</td>
                    <td class="sticky-col-2 ${couleurClasse}">${e.nom || ''} ${e.prenoms || ''}</td>`;

                const joursNoms = ['L', 'Ma', 'Me', 'J', 'V'];
                moisAffiches.forEach((m) => {
                    let mIdx = moisAnnee.findIndex(item => item.nom === m.nom);
                    for (let s = 1; s <= 4; s++) {
                        for (let d = 1; d <= 5; d++) {
                            let jourNom = joursNoms[d - 1];
                            let jColor = joursCouleurs[jourNom];
                            let cellId = `abs_${matriculeEleve}_m${mIdx}_s${s}_d${d}`;
                            let cleMap = `${matriculeEleve}_${m.nom}_${s}_${d}`;
                            let etatInitial = mapAbsences[cleMap] || 0;

                            let classeEtat = '';
                            if (etatInitial === 1) classeEtat = 'etat-1';
                            if (etatInitial === 2) classeEtat = 'etat-2';

                            tr += `<td class="absence-cell ${classeEtat}" id="${cellId}" data-etat="${etatInitial}" data-matricule="${matriculeEleve}" data-mois="${m.nom}" data-semaine="${s}" data-jour="${d}" style="background-color: ${jColor.bg};" onclick="gererClicCellule(this)">
                                <div class="trait-h"></div>
                                <div class="trait-v"></div>
                            </td>`;
                        }
                    }
                });
                tr += `</tr>`;
                tbody.innerHTML += tr;
            });

            mettreAJourTableauTaux();
        }

        function gererClicCellule(cellule) {
            if (currentParentId) return; // Lecture seule pour l'élève connecté
            let etatActuel = parseInt(cellule.getAttribute('data-etat')) || 0;
            let nouvelEtat = (etatActuel + 1) % 3;
            cellule.setAttribute('data-etat', nouvelEtat);
            cellule.classList.remove('etat-1', 'etat-2');
            if (nouvelEtat === 1) {
                cellule.classList.add('etat-1');
            } else if (nouvelEtat === 2) {
                cellule.classList.add('etat-2');
            }
            mettreAJourTableauTaux();
        }

        function initialiserTableauTauxMensuel() {
            const corpsTaux = document.getElementById('corps-tableau-taux');
            if (!corpsTaux) return;
            corpsTaux.innerHTML = '';

            moisAnnee.forEach((m, idx) => {
                let tr = `<tr id="ligne-taux-${idx}">
                    <td style="font-weight: bold; background-color: ${m.bg}; color: ${m.color};">${m.nom}</td>
                    <td id="eff-${idx}">0</td>
                    <td><input type="number" class="input-jours" id="jours-${idx}" value="20" min="0" max="31" oninput="mettreAJourTableauTaux()"></td>
                    <td id="pot-${idx}">0</td>
                    <td id="abs-${idx}">0</td>
                    <td id="pres-${idx}">0</td>
                    <td id="taux-${idx}" style="font-weight: bold; color: #2563eb;">0.00%</td>
                </tr>`;
                corpsTaux.innerHTML += tr;
            });
            mettreAJourTableauTaux();
        }

        function mettreAJourTableauTaux() {
            if (currentParentId) return;
            const elevesActifs = classeFiltreeActuelle === 'Tous'
                ? listeEleves
                : listeEleves.filter(e => e.niveau && e.niveau.toUpperCase() === classeFiltreeActuelle.toUpperCase());

            const effectif = elevesActifs.length;
            const matriculesActifsSet = new Set(elevesActifs.map(e => e.matricule));

            const mapEtatActuel = {};
            donneesAbsencesRecuperees.forEach(ab => {
                const cle = `${ab.matricule}_${ab.mois}_${ab.semaine}_${ab.jour}`;
                mapEtatActuel[cle] = ab.etat;
            });
            document.querySelectorAll('.absence-cell').forEach(cell => {
                const mat = cell.dataset.matricule;
                const mois = cell.dataset.mois;
                const sem = cell.dataset.semaine;
                const jour = cell.dataset.jour;
                const etat = parseInt(cell.dataset.etat) || 0;
                const cle = `${mat}_${mois}_${sem}_${jour}`;
                mapEtatActuel[cle] = etat;
            });

            moisAnnee.forEach((m, idx) => {
                const inputJours = document.getElementById(`jours-${idx}`);
                const joursOuvrables = inputJours ? (parseInt(inputJours.value) || 0) : 20;
                const presPotentielles = effectif * joursOuvrables;
                let totalAbsences = 0;
                matriculesActifsSet.forEach(mat => {
                    for (let s = 1; s <= 4; s++) {
                        for (let d = 1; d <= 5; d++) {
                            const cle = `${mat}_${m.nom}_${s}_${d}`;
                            totalAbsences += mapEtatActuel[cle] || 0;
                        }
                    }
                });

                const totalPresences = Math.max(0, presPotentielles - totalAbsences);
                const taux = presPotentielles > 0 ? ((totalPresences / presPotentielles) * 100).toFixed(2) : "0.00";

                const effEl = document.getElementById(`eff-${idx}`);
                const potEl = document.getElementById(`pot-${idx}`);
                const absEl = document.getElementById(`abs-${idx}`);
                const presEl = document.getElementById(`pres-${idx}`);
                const tauxEl = document.getElementById(`taux-${idx}`);

                if (effEl) effEl.textContent = effectif;
                if (potEl) potEl.textContent = presPotentielles;
                if (absEl) absEl.textContent = totalAbsences;
                if (presEl) presEl.textContent = totalPresences;
                if (tauxEl) tauxEl.textContent = taux + '%';
            });
        }

        function filtrer(niveau, btnElement) {
            classeFiltreeActuelle = niveau;
            if (btnElement) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            } else {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    if (b.textContent.trim() === niveau) b.classList.add('active');
                    else b.classList.remove('active');
                });
            }
            if (currentParentId) {
                afficherTableau(listeEleves);
            } else if (niveau === 'Tous') {
                afficherTableau(listeEleves);
            } else {
                afficherTableau(listeEleves.filter(e => e.niveau && e.niveau.toUpperCase() === niveau.toUpperCase()));
            }
        }

        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'select-all') {
                document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = e.target.checked);
            }
        });

        function sauvegarderAbsences() {
            if (currentParentId) return;
            const mapEtatActuel = {};
            donneesAbsencesRecuperees.forEach(ab => {
                const cle = `${ab.matricule}_${ab.mois}_${ab.semaine}_${ab.jour}`;
                mapEtatActuel[cle] = ab.etat;
            });
            document.querySelectorAll('.absence-cell').forEach(cell => {
                const mat = cell.dataset.matricule;
                const mois = cell.dataset.mois;
                const sem = cell.dataset.semaine;
                const jour = cell.dataset.jour;
                const etat = parseInt(cell.dataset.etat) || 0;
                const cle = `${mat}_${mois}_${sem}_${jour}`;
                mapEtatActuel[cle] = etat;
            });
            const absences = [];
            Object.entries(mapEtatActuel).forEach(([cle, etat]) => {
                if (etat > 0) {
                    const [matricule, mois, semaine, jour] = cle.split('_');
                    absences.push({
                        matricule: matricule,
                        mois: mois,
                        semaine: semaine,
                        jour: jour,
                        etat: etat
                    });
                }
            });

            donneesAbsencesRecuperees = absences;
            try {
                localStorage.setItem(`absences_${anneeSelectionnee}`, JSON.stringify(absences));
            } catch (e) {
                console.error("Erreur localStorage", e);
            }

            fetch('/api/absences/sauvegarder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ annee: anneeSelectionnee, absences: absences })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("✅ Absences enregistrées avec succès !");
                } else {
                    alert("⚠️ Enregistré localement (Alerte serveur : " + (data.message || "Inconnue") + ")");
                }
            })
            .catch(err => {
                console.warn("Mode simulation / Pas de serveur distant, sauvegarde locale effectuée.", err);
                alert("✅ Absences enregistrées avec succès !");
            });
        }

        function imprimerRegistre() {
            window.print();
        }
    </script>
</body>
</html>

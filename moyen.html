

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moyennes, Rangs et Bascule</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        h2 { color: #333; }
        .top-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .filter-container { display: flex; gap: 5px; margin-bottom: 15px; }
        .filter-btn { padding: 8px 15px; cursor: pointer; border: 1px solid #ccc; background-color: #f8f9fa; border-radius: 4px; font-weight: bold; }
        .filter-btn.active { background-color: #007bff; color: white; border-color: #007bff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f4f4f4; }
        td:nth-child(3), td:nth-child(4) { text-align: left; }
        .btn { padding: 10px 20px; color: white; text-decoration: none; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        input[type="number"], select { width: 75px; padding: 5px; text-align: center; }
    </style>
</head>
<body>

    <div class="top-container">
        <h2 id="titre-annee">Moyennes, Rangs et Bascule</h2>
        <select id="annee-select" onchange="changerAnnee()">
            <option value="2028">2028-2029</option>
            <option value="2027">2027-2028</option>
            <option value="2026">2026-2027</option>
            <option value="2025" selected>2025-2026</option>
            <option value="2024">2024-2025</option>
            <option value="2023">2023-2024</option>
            <option value="2022">2022-2023</option>
            <option value="2021">2021-2022</option>
        </select>
    </div>

    <div class="filter-container">
        <button class="filter-btn active" onclick="filtrer('Tous', this)">Tous</button>
        <button class="filter-btn" onclick="filtrer('CP1', this)">CP1</button>
        <button class="filter-btn" onclick="filtrer('CP2', this)">CP2</button>
        <button class="filter-btn" onclick="filtrer('CE1', this)">CE1</button>
        <button class="filter-btn" onclick="filtrer('CE2', this)">CE2</button>
        <button class="filter-btn" onclick="filtrer('CM1', this)">CM1</button>
        <button class="filter-btn" onclick="filtrer('CM2', this)">CM2</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>N°</th>
                <th>Matricule</th>
                <th style="text-align: left;">Nom</th>
                <th style="text-align: left;">Prénoms</th>
                <th>Niveau</th>
                <th>Date Naiss.</th>
                <th>Sexe</th>
                <th>moyen_total</th>
                <th>Rang</th>
                <th>DFA (A/R)</th>
            </tr>
        </thead>
        <tbody id="tableau-moyennes"></tbody>
    </table>

    <div style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
        <button onclick="enregistrerModifications()" class="btn" style="background-color: #007bff;">Enregistrer les modifications</button>
        <button onclick="validerBascule()" class="btn" style="background-color: #28a745;">Valider la Bascule</button>
        <a href="accueil.html" class="btn" style="background-color: #6c757d;">Retour</a>
    </div>

<script>
    let listeEleves = [];
    let classeFiltreeActuelle = 'Tous';

    function changerAnnee() {
        const annee = document.getElementById('annee-select').value;
        window.location.href = `moyen.html?annee=${annee}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const annee = urlParams.get('annee') || '2025';
    document.getElementById('annee-select').value = annee;

    fetch(`/api/eleves/${annee}?periode=FIN_ANNEE`)
        .then(res => res.json())
        .then(data => {
            listeEleves = Array.isArray(data) ? data : (data.eleves || []);
            afficherTableau(listeEleves);
        })
        .catch(err => {
            console.error("Erreur chargement:", err);
            document.getElementById('tableau-moyennes').innerHTML = `<tr><td colspan="10" style="color:red; text-align:center;">Erreur de chargement des données.</td></tr>`;
        });

    function afficherTableau(data) {
        const tbody = document.getElementById('tableau-moyennes');
        tbody.innerHTML = '';
        
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="padding:15px; color:#666; text-align:center;">Aucun élève trouvé.</td></tr>`;
            return;
        }

        data.forEach((e, index) => {
            let totalValue = '0.00';
            if (e.moyen_total !== undefined && e.moyen_total !== null && e.moyen_total !== '') {
                totalValue = parseFloat(e.moyen_total).toFixed(2);
            } else if (e.moyenne !== undefined && e.moyenne !== null && e.moyenne !== '') {
                totalValue = parseFloat(e.moyenne).toFixed(2);
            } else if (e.moyen !== undefined && e.moyen !== null && e.moyen !== '') {
                totalValue = parseFloat(e.moyen).toFixed(2);
            } else if (e.mg !== undefined && e.mg !== null && e.mg !== '') {
                totalValue = parseFloat(e.mg).toFixed(2);
            }

            let rangValue = e.rang !== undefined && e.rang !== null && e.rang !== '' ? e.rang : (index + 1);
            let decisionVal = e.decision ?? '';
            let niveauEleve = e.niveau || '';

            tbody.innerHTML += `
                <tr data-id="${e.matricule || ''}">
                    <td>${index + 1}</td>
                    <td>${e.matricule || ''}</td>
                    <td style="text-align: left;">${e.nom || ''}</td>
                    <td style="text-align: left;">${e.prenoms || ''}</td>
                    <td>${niveauEleve}</td>
                    <td>${e.date_naissance || ''}</td>
                    <td>${e.sexe || ''}</td>
                    <td><input type="number" step="0.01" class="edit-mg" value="${totalValue}"></td>
                    <td><input type="number" class="edit-rang" value="${rangValue}"></td>
                    <td>
                        <select class="dfa-select">
                            <option value="" ${!decisionVal ? 'selected' : ''}>--</option>
                            <option value="A" ${decisionVal === 'A' ? 'selected' : ''}>A</option>
                            <option value="R" ${decisionVal === 'R' ? 'selected' : ''}>R</option>
                        </select>
                    </td>
                </tr>`;
        });
    }

    function enregistrerModifications() {
        const lignes = document.querySelectorAll('tbody tr[data-id]');
        if (lignes.length === 0) {
            alert("Aucune donnée à enregistrer.");
            return;
        }

        const updates = [];
        lignes.forEach(tr => {
            let rawMg = tr.querySelector('.edit-mg').value;
            let formattedMg = rawMg ? parseFloat(rawMg).toFixed(2) : '0.00';
            let rangVal = tr.querySelector('.edit-rang').value;
            let decisionVal = tr.querySelector('.dfa-select').value;

            updates.push({
                matricule: tr.getAttribute('data-id'),
                moyen_total: formattedMg,
                moyenne: formattedMg,
                moyen: formattedMg,
                rang: rangVal,
                decision: decisionVal,
                periode: 'RESULTATS FIN ANNEE'
            });
        });

        fetch('/api/update-notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ updates: updates, annee: annee, periode: 'RESULTATS FIN ANNEE' })
        }).then(res => res.json())
          .then(data => {
              if(data.success) {
                  alert("✅ Moyennes et rangs enregistrés avec succès !");
              } else {
                  alert("⚠️ Erreur lors de l'enregistrement.");
              }
          })
          .catch(err => {
              console.error("Erreur réseau:", err);
              alert("❌ Erreur réseau.");
          });
    }

    function validerBascule() {
        const rows = document.querySelectorAll('tbody tr[data-id]');
        const decisions = [];
        rows.forEach(tr => {
            const select = tr.querySelector('.dfa-select');
            if(select && select.value) {
                decisions.push({ matricule: tr.getAttribute('data-id'), decision: select.value });
            }
        });

        if(decisions.length === 0) return alert("Sélectionnez A ou R pour basculer.");

        if(confirm(`Confirmer le basculement de ${decisions.length} élève(s) ?`)) {
            fetch('/api/basculer-eleves', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ decisions: decisions, annee_source: annee })
            })
            .then(res => res.json())
            .then(data => {
                alert("✅ Bascule effectuée !");
                location.reload();
            })
            .catch(err => {
                console.error("Erreur bascule:", err);
                alert("❌ Erreur lors de la bascule.");
            });
        }
    }

    function filtrer(niveau, btnElement) {
        classeFiltreeActuelle = niveau;
        if(btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        if (niveau === 'Tous') {
            afficherTableau(listeEleves);
        } else {
            afficherTableau(listeEleves.filter(e => e.niveau && e.niveau.toUpperCase() === niveau.toUpperCase()));
        }
    }
</script>
</body>
</html>
